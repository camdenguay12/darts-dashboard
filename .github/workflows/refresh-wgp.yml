name: Refresh PDC results

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules are UTC. Every 15 minutes; the script only commits when data changes.
    - cron: '*/15 * * * *'

concurrency:
  group: pdc-results-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch official PDC results
        run: python scripts/pdc_refresh.py
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/pdc-live.json; then
            echo "No PDC data changes."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/pdc-live.json
          git commit -m "Auto-refresh PDC darts results"
          git push
